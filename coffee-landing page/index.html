<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Landing Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lobster&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <nav class="navbar">
            <a href="#" class="logo">
                <span class="coffee-icon">☕</span>
                <span>Coffee</span>
            </a>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Menu</a>
                <a href="#">Testimonials</a>
                <a href="#">Gallery</a>
                <a href="#">Contact</a>
            </div>
        </nav>

        <section class="hero">

            <div class="hero-content">
                <p class="subtitle">Best Coffee</p>

                <h1>
                    Make your day great with our
                    <br>
                    special coffee!
                </h1>

                <p class="description">
                    Welcome to our coffee paradise where every bean tells
                    <br>
                    a story and every cup sparks joy.
                </p>

                <div class="buttons">
                    <a href="#" class="btn btn-1">Order Now</a>
                    <a href="#" class="btn btn-2">Contact Us</a>
                </div>
            </div>

            <div class="hero-image">
                <img src="./flying-coffee cup.png" alt="Cup of coffee">
            </div>

        </section>

    </main>

</body>

</html>
