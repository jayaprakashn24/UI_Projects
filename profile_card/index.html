<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <section class="team-container">

        <div class="team-card">
            <img src="./profile.jpg" alt="Jessica Hawks" class="profile-image">

            <h3>Jessica Hawks</h3>
            <p>Web Designer</p>

            <button>Hire Now</button>
        </div>

        <div class="team-card">
            <img src="./profile.jpg" alt="Kate Will" class="profile-image">

            <h3>Kate Will</h3>
            <p>Web Developer</p>

            <button>Hire Now</button>
        </div>

        <div class="team-card">
            <img src="./profile.jpg" alt="Alex Smith" class="profile-image">

            <h3>Alex Smith</h3>
            <p>UI/UX Designer</p>

            <button>Hire Now</button>
        </div>

    </section>

</body>

</html>
