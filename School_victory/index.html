<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Hardy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                Medical Hardy
            </div>

            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">Pricing</a>
                <a href="#">Contact</a>
            </nav>

            <div class="buttons">
                <button class="login" type="button">Login</button>
                <button class="join-btn" type="button">Join us</button>
            </div>

        </header>

        <!-- Hero Section -->
        <main class="hero">

            <!-- Hero Content -->
            <section class="hero-content">

                <div class="remote">
                    Online
                </div>

                <h1 class="hero-title">
                    HIGH QUALITY<br>
                    COURSES
                </h1>

                <p class="hero-description">
                    Every day brings with it a fresh set of
                    learning possibilities.
                </p>

                <div class="buttons">
                    <button class="quote-btn" type="button">
                        Get Quote Now
                    </button>

                    <button class="learn-btn" type="button">
                        Learn More
                    </button>
                </div>

            </section>

            <!-- Hero Visual -->
            <section class="hero-visual">

                <div class="green-circle"></div>

                <img class="child" src="./boy-1.svg" alt="Student">

                <!-- Graph -->
                <div class="graph-card">
                    <img src="./statistics.svg" alt="Statistics">
                </div>

                <!-- Calendar -->
                <div class="calendar">
                    <img src="./calender.svg" alt="Calendar">
                </div>

                <!-- Scores -->
                <div class="score-card">
                    <img src="./score.svg" alt="Student scores">
                </div>

                <!-- Statistics -->
                <div class="stats-card">
                    <img src="./infocircle.svg" alt="Infographics">
                </div>

            </section>

        </main>

    </div>

</body>

</html>
