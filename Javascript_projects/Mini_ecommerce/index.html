<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mini Shop-js</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">Mini <span>Shop</span></div>

        <button class="cart-button" id="cartButton" type="button">
            Cart
            <span id="cartCount">0</span>
        </button>
    </header>

    <!-- Main -->
    <main class="container">
        <!-- Hero -->
        <section class="hero">
            <h1>Everything you need</h1>
            <p>Simple products. Simple shopping.</p>
        </section>

        <!-- Search and Filter -->
        <section class="controls">
            <input type="text" id="searchInput" placeholder="Search products..." aria-label="Search products" />

            <select id="categoryFilter" aria-label="Filter products by category">
                <option value="all">All categories</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="accessories">Accessories</option>
            </select>
        </section>

        <!-- Products -->
        <section>
            <h2>Products</h2>
            <div class="products" id="productContainer"></div>
        </section>
    </main>

    <!-- Cart -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart">
            <!-- Cart Header -->
            <div class="cart-header">
                <h2>Your Cart</h2>

                <button id="closeCart" type="button" aria-label="Close cart">
                    &times;
                </button>
            </div>

            <!-- Cart Items -->
            <div class="cart-items" id="cartItems"></div>

            <!-- Cart Footer -->
            <div class="cart-footer">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal">$0</strong>
                </div>

                <div class="summary-row">
                    <span>Discount</span>
                    <strong id="discount">$0</strong>
                </div>

                <div class="summary-row">
                    <span>Total</span>
                    <strong id="total">$0</strong>
                </div>

                <button class="checkout-btn" id="checkoutButton" type="button">
                    Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>

</html>
