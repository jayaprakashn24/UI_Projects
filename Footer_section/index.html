<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qube.ai Footer</title>

    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="sytle.css">

</head>

<body>

    <footer class="footer">

        <!-- Top -->
        <div class="footer-top">

            <div class="footer-info">

                <div class="logo">
                    <span class="logo-icon"></span>
                    <span>qube.ai</span>
                </div>

                <p class="description">
                    Our mission is to empower anyone to turn ideas into reality
                    through AI, with as little effort as possible.
                </p>

                <nav class="footer-nav">
                    <a href="#">About</a>
                    <a href="#">Guides</a>
                    <a href="#">Support</a>
                    <a href="#">Contact</a>
                </nav>

            </div>

            <!-- App stores -->
            <div class="store-buttons">

                <a href="#" class="store-btn">
                    <i class="fa-brands fa-google-play"></i>

                    <span class="store-text">
                        <span class="store-small">Get it on</span>
                        <span class="store-name">Google Play</span>
                    </span>
                </a>

                <a href="#" class="store-btn">
                    <i class="fa-brands fa-apple"></i>

                    <span class="store-text">
                        <span class="store-small">Download on the</span>
                        <span class="store-name">App Store</span>
                    </span>
                </a>

            </div>

        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Bottom -->
        <div class="footer-bottom">

            <p class="copyright">
                Copyright 2026 © qube.ai. All rights reserved.
            </p>

            <div class="social-links">
                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>

                <a href="#" aria-label="X">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>

                <a href="#" aria-label="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>

                <a href="#" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>

        </div>

    </footer>

</body>

</html>
